<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FFM - Fast File Manager</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
<link rel="stylesheet" href="assets/inter/Inter.css">
<script src="assets/tailwindui/tailwind.min.js"></script>
<script>
tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','Arial','Helvetica','sans-serif']}}}}
</script>
<script>
!function(){function t(){var e=document.documentElement;e.classList.toggle('dark',e.dataset.theme==='dark')}var e=new MutationObserver(t);e.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']}),t()}()
</script>
<link rel="stylesheet" href="style.css">
</head>
<body class="font-sans bg-gray-100 dark:bg-slate-900 text-gray-900 dark:text-gray-100 h-screen overflow-hidden transition-colors">

<div id="auth-overlay" class="fixed inset-0 z-50 flex items-center justify-center auth-gradient">
  <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-gray-200 dark:border-slate-700 p-8 mx-3 min-w-[360px] max-w-md w-full transition-colors">
    <h2 class="flex items-center gap-3 mb-5 text-lg font-semibold">
      <img src="/logo.png" class="h-14" alt="">
      <span id="auth-title">FFM</span>
    </h2>
    <form id="auth-form" class="flex flex-col gap-3.5">
      <div id="config-group" class="flex flex-col gap-3.5">
        <input type="text"     id="host"     data-i18n-placeholder="host"     placeholder="Host / IP" required
          class="w-full px-3.5 py-2.5 border border-gray-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-gray-900 dark:text-gray-100 text-sm placeholder-gray-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 transition-shadow">
        <input type="number"   id="port"     data-i18n-placeholder="port"     placeholder="Port"      value="21" required
          class="w-full px-3.5 py-2.5 border border-gray-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-gray-900 dark:text-gray-100 text-sm placeholder-gray-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 transition-shadow">
        <label class="checkbox-row flex items-center gap-2 pt-1.5 text-sm text-gray-500 dark:text-slate-400 cursor-pointer select-none" id="passive-row">
          <input type="checkbox" id="passive" checked
            class="w-4 h-4 accent-blue-600 dark:accent-blue-400">
          <span data-i18n="passive">Passive mode</span>
          <i class="fas fa-question-circle text-xs text-gray-400 dark:text-slate-500" title="Passive FTP mode"></i>
        </label>
      </div>
      <input type="text"     id="username" data-i18n-placeholder="username" placeholder="Username"
        class="w-full px-3.5 py-2.5 border border-gray-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-gray-900 dark:text-gray-100 text-sm placeholder-gray-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 transition-shadow">
      <input type="password" id="password" data-i18n-placeholder="password" placeholder="Password"
        class="w-full px-3.5 py-2.5 border border-gray-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-gray-900 dark:text-gray-100 text-sm placeholder-gray-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 transition-shadow">
      <p id="auth-error" class="error text-red-500 dark:text-red-400 text-xs -mt-1 hidden"></p>
      <div class="auth-actions flex items-center justify-between gap-3">
        <button type="submit"
          class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded-lg text-sm font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500/40 flex items-center gap-2">
          <i class="fas fa-sign-in-alt"></i> <span data-i18n="connect">Connect</span>
        </button>
        <select id="auth-btn-lang" class="lang-select px-2 py-2.5 text-sm font-semibold border border-gray-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-gray-500 dark:text-slate-400 cursor-pointer transition-colors"></select>
        <select id="auth-btn-theme" class="px-2 py-2.5 text-sm font-semibold border border-gray-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-gray-500 dark:text-slate-400 cursor-pointer transition-colors">
          <option value="auto" data-i18n="theme_auto">Auto</option>
          <option value="light" data-i18n="theme_light">Light</option>
          <option value="dark" data-i18n="theme_dark">Dark</option>
        </select>
      </div>
    </form>
  </div>
  <div class="fixed bottom-4 right-5 flex items-center gap-3 text-xs text-gray-500 dark:text-slate-400">
    <span id="auth-version"></span>
    <a id="auth-github" href="https://github.com/serenitatis/ffm" target="_blank" rel="noopener" class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
      <i class="fab fa-github text-sm"></i>
    </a>
  </div>
</div>

<div id="props-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-black/35 dark:bg-black/60 hidden">
  <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-gray-200 dark:border-slate-700 p-7 mx-3 min-w-[360px] max-w-sm w-full transition-colors">
    <h2 id="props-title" class="flex items-center gap-2 mb-4 text-base font-semibold">
      <i class="fas fa-info-circle text-blue-600 dark:text-blue-400"></i>
      <span data-i18n="properties">Properties</span>
    </h2>
    <div id="props-body" class="text-sm space-y-2"></div>
    <button id="props-close"
      class="mt-4 w-full py-2.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded-lg text-sm font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500/40 flex items-center justify-center gap-2">
      <i class="fas fa-times"></i> <span data-i18n="close">Close</span>
    </button>
  </div>
</div>

<div id="main" class="hidden h-screen flex flex-col">
  <div class="toolbar flex items-center gap-2 px-3 py-2 bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700 shrink-0 transition-colors">
    <div id="breadcrumb" class="flex-1 flex items-center gap-0.5 overflow-x-auto px-1 min-w-0"></div>
    <button id="btn-refresh"    data-i18n="refresh"    data-i18n-title="refresh"
      class="px-2.5 py-1.5 bg-white dark:bg-slate-700 border border-gray-200 dark:border-slate-600 rounded-md text-xs cursor-pointer text-gray-900 dark:text-gray-100 hover:bg-gray-50 dark:hover:bg-slate-600 transition-colors">
      <i class="fas fa-sync-alt"></i>
    </button>
    <button id="btn-mkdir"     class="mobile-only hidden px-2.5 py-1.5 bg-white dark:bg-slate-700 border border-gray-200 dark:border-slate-600 rounded-md text-xs cursor-pointer text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-slate-600 transition-colors items-center gap-1" data-i18n="new_folder" data-i18n-title="new_folder">
      <i class="fas fa-folder-plus"></i>
    </button>
    <button id="btn-done"      class="hidden px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-xs font-medium transition-colors flex items-center gap-1.5">
      <i class="fas fa-check"></i> <span data-i18n="done">Done</span>
    </button>
    <button id="btn-menu"      data-i18n-title="menu"
      class="bg-transparent border-none text-base px-2.5 py-1.5 text-gray-900 dark:text-gray-100 cursor-pointer transition-colors">
      <i class="fas fa-bars"></i>
    </button>
  </div>
  <div id="op-bar" class="op-bar op-bar-hidden flex items-center gap-3 px-3 py-2 border-b border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 shrink-0">
    <span id="op-bar-content" class="flex items-center gap-2 text-xs text-blue-600 dark:text-blue-400"></span>
    <button id="op-cancel" class="flex items-center gap-1.5 px-2 py-1 text-xs rounded border border-blue-300 dark:border-blue-600 text-blue-600 dark:text-blue-400 hover:bg-blue-100 dark:hover:bg-blue-500/20 cursor-pointer transition-colors">
      <i class="fas fa-times"></i> <span data-i18n="cancel">Cancel</span>
    </button>
  </div>
  <div id="menu-dropdown" class="menu-dropdown hidden absolute top-[48px] right-3 bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-lg shadow-xl min-w-[200px] z-50 py-1.5 transition-colors">
    <div class="menu-row px-3.5 py-2 text-xs flex items-center gap-2 cursor-pointer hover:bg-gray-50 dark:hover:bg-slate-700/50 transition-colors">
      <select id="menu-lang" class="lang-select w-full appearance-auto bg-white dark:bg-slate-700 border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1 text-xs text-gray-700 dark:text-gray-300 cursor-pointer transition-colors"></select>
    </div>
    <div class="menu-row px-3.5 py-2 text-xs flex items-center gap-2 cursor-pointer hover:bg-gray-50 dark:hover:bg-slate-700/50 transition-colors">
      <select id="menu-theme" class="w-full appearance-auto bg-white dark:bg-slate-700 border border-gray-200 dark:border-slate-600 rounded-md px-2 py-1 text-xs text-gray-700 dark:text-gray-300 cursor-pointer transition-colors">
        <option value="auto" data-i18n="theme_auto">Auto</option>
        <option value="light" data-i18n="theme_light">Light</option>
        <option value="dark" data-i18n="theme_dark">Dark</option>
      </select>
    </div>
    <hr class="border-t border-gray-200 dark:border-slate-700 mx-2 my-1">
    <div class="menu-row px-3.5 py-2 text-xs flex items-center gap-2 cursor-pointer hover:bg-gray-50 dark:hover:bg-slate-700/50 transition-colors" id="menu-logout">
      <i class="fas fa-sign-out-alt w-4 text-center text-gray-400 dark:text-slate-400"></i>
      <span data-i18n="logout">Выход</span>
    </div>
    <hr class="border-t border-gray-200 dark:border-slate-700 mx-2 my-1">
    <a class="menu-row px-3.5 py-2 text-xs flex items-center gap-2 cursor-pointer hover:bg-gray-50 dark:hover:bg-slate-700/50 transition-colors no-underline text-gray-900 dark:text-gray-100" id="menu-github" href="https://github.com/serenitatis/ffm" target="_blank" rel="noopener">
      <i class="fab fa-github w-4 text-center text-gray-400 dark:text-slate-400"></i> GitHub
    </a>
    <div class="menu-row px-3.5 py-2 text-xs flex items-center gap-2 text-gray-500 dark:text-slate-400" id="menu-version"></div>
  </div>
  <input type="file" id="file-input" hidden multiple>
  <button id="btn-upload-fab" class="fab-upload fixed bottom-6 right-6 w-14 h-14 rounded-full bg-blue-400 hover:bg-blue-500 active:bg-blue-600 text-white shadow-lg hover:shadow-xl flex items-center justify-center z-50 transition-all hover:scale-105 active:scale-95 border-none cursor-pointer text-xl" title="Upload file">
    <i class="fas fa-upload"></i>
  </button>
  <div id="table-wrap" class="flex-1 overflow-y-auto relative bg-white dark:bg-slate-800 transition-colors">
    <table class="w-full border-collapse table-fixed">
      <thead>
        <tr class="bg-white dark:bg-slate-800 sticky top-0 z-10">
          <th class="cb-cell text-left px-4 py-2.5 text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 border-b-2 border-gray-200 dark:border-slate-700 select-none">&thinsp;</th>
          <th data-col="name" class="sort-col text-left px-4 py-2.5 text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 border-b-2 border-gray-200 dark:border-slate-700 select-none cursor-pointer hover:text-gray-900 dark:hover:text-gray-200">
            <i class="fas fa-fw"></i> <span data-i18n="name">Name</span> <span class="sort-indicator"></span>
          </th>
          <th data-col="size" class="sort-col text-left px-4 py-2.5 text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 border-b-2 border-gray-200 dark:border-slate-700 select-none cursor-pointer hover:text-gray-900 dark:hover:text-gray-200">
            <span data-i18n="size">Size</span> <span class="sort-indicator"></span>
          </th>
          <th data-col="date" class="sort-col text-left px-4 py-2.5 text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 border-b-2 border-gray-200 dark:border-slate-700 select-none cursor-pointer hover:text-gray-900 dark:hover:text-gray-200">
            <span data-i18n="date">Date</span> <span class="sort-indicator"></span>
          </th>
        </tr>
      </thead>
      <tbody id="file-list"></tbody>
    </table>
    <div id="drop-overlay" class="hidden absolute inset-0 flex items-center justify-center flex-col gap-4 z-50 bg-blue-500/10 text-blue-600 dark:text-blue-400 text-lg font-medium pointer-events-none">
      <i class="fas fa-cloud-upload-alt text-5xl"></i>
      <span data-i18n="drop_files">Drop files to upload</span>
    </div>
  </div>
</div>

<ul id="ctx-menu" class="ctx-menu hidden fixed bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-lg shadow-xl py-1.5 min-w-[195px] z-50 transition-colors"></ul>

<script src="lang.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
